# Keep this identity unchanged for local links and managed GitHub installs.
id = "c0r0nell.agents-sidebar"
name = "Agents Sidebar"
version = "0.2.2"
min_herdr_version = "0.9.3"
description = "Grouped and priority layouts for Herdr's native agent sidebar."
platforms = ["linux"]

[[build]]
command = ["python3", "-B", "sidebar.py", "check"]

[[startup]]
command = ["python3", "-B", "sidebar.py", "ensure"]

[[actions]]
id = "settings"
title = "Settings"
description = "Configure and activate independent Grouped and Priority layouts."
command = ["python3", "-B", "sidebar.py", "settings-open"]

[[actions]]
id = "restart"
title = "Restart sidebar"
description = "Reload the active sidebar worker, preserving settings and inactive modes."
command = ["python3", "-B", "sidebar.py", "restart"]

[[actions]]
id = "restore"
title = "Restore defaults"
description = "Reset both profiles to factory settings; keep both modes inactive and the native sidebar."
command = ["python3", "-B", "sidebar.py", "restore"]

[[panes]]
id = "settings"
title = "Agents Sidebar settings"
placement = "popup"
width = 60
height = 18
command = ["python3", "-B", "sidebar.py", "settings"]

[[events]]
on = "workspace.focused"
command = ["python3", "-B", "sidebar.py", "ensure"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-B", "sidebar.py", "ensure"]

[[events]]
on = "pane.focused"
command = ["python3", "-B", "sidebar.py", "ensure"]

[[events]]
on = "tab.focused"
command = ["python3", "-B", "sidebar.py", "ensure"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-B", "sidebar.py", "ensure"]
